# ----------------------------------------------------------------------
# Network Listeners
# ----------------------------------------------------------------------
# Standard MQTT listener over raw TCP
listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener for browser-based dashboards and clients
listener 9001 0.0.0.0
protocol websockets

# ----------------------------------------------------------------------
# Security & Authentication
# ----------------------------------------------------------------------
# Reject any unauthenticated client connection
allow_anonymous false

# Locations of credentials and access policies
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl.conf

# ----------------------------------------------------------------------
# Persistence & Logging
# ----------------------------------------------------------------------
# Store QoS 1/2 in-flight messages and retained topics across restarts
persistence true
persistence_location /mosquitto/data/

# Log output directly to stdout/stderr so 'docker logs' can capture it
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information