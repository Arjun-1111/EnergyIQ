# ======================================================================
# Access Control List (ACL) Configuration
# ======================================================================

# ----------------------------------------------------------------------
# Device Isolation Pattern
# ----------------------------------------------------------------------
# %u dynamically resolves to the client's authenticated username.
# Allows each device to publish telemetry and subscribe to commands
# strictly within its own assigned topic hierarchy.
pattern readwrite energyiq/devices/%u/#

# ----------------------------------------------------------------------
# Central Ingestion & Bridge Service
# ----------------------------------------------------------------------
# Specific user configuration for the backend MQTT -> Kafka bridge.
# Needs read-only access across all device telemetry streams.
user bridge-user
topic read energyiq/devices/#