services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: energyiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: energyiq
      POSTGRES_PASSWORD: energyiq_dev
      POSTGRES_DB: energyiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro    #HOST:CONTAINER:MODE
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energyiq -d energyiq"]
      interval: 5s
      retries: 5
      timeout: 3s
      start_period: 10s
    networks:
        - energyiq-net

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: energyiq-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: energyiq
      POSTGRES_PASSWORD: energyiq_dev
      POSTGRES_DB: energy_db
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro    #HOST:CONTAINER:MODE
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U energyiq -d energy_db" ]
      interval: 5s
      retries: 5
      timeout: 3s
      start_period: 10s
    networks:
      - energyiq-net

  redis:
    image: redis:7-alpine
    container_name: energyiq-redis
    restart: unless-stopped
    # Start Redis with disk persistence and a 512MB RAM cap:
    # --appendonly yes: Save every write to disk (AOF) so data survives restarts (pair with a /data volume)
    # --maxmemory 512mb: Prevent Redis from exceeding 512MB RAM and crashing other services
    # --maxmemory-policy allkeys-lru: Automatically evict least-recently-used keys when RAM is full
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
        - energyiq-net

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: energyiq-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
      - ./mosquitto/passwords:/mosquitto/config/passwords:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      # mosquitto_sub subscribes to a dummy topic with a 2-second timeout (-W 2).
      # If the broker accepts the network connection, the exit code is 0 (healthy).
      test: [ "CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 2 -u 'bridge-user' -P 'bridge-pass' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
        - energyiq-net


volumes:
  postgres_data:
  timescaledb_data:
  redis_data:
  mosquitto_data:

networks:
  energyiq-net:
    driver: bridge